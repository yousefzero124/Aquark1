<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عقارك</title>
  <script>try{var l=localStorage.getItem("aqarak_lang")==="en"?"en":"ar";document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";}catch(e){}</script>
  <script src="js/guard.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/font/lucide.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard" data-title="page_dashboard">

  <div id="site-header"></div>

  <!-- لوحة كل مستخدم حسب نوع حسابه: مشتري / مستثمر / بروكر (الأدمن ليه admin) -->
  <section class="page-head">
    <div class="container dash-head">
      <div>
        <span class="role-chip" id="dashRole"></span>
        <h1 id="dashHello"></h1>
        <p id="dashSub"></p>
      </div>
      <div class="btn-row" id="dashActions"></div>
    </div>
    <!-- تابات للمستثمر بس: عقاراتي / حاسبة الاستثمار -->
    <div class="container">
      <div class="seg hidden dash-tabs" id="dashTabs">
        <button type="button" data-tab="listings" data-i18n="my_listings"></button>
        <button type="button" data-tab="calc" data-i18n="page_invest"></button>
      </div>
    </div>
  </section>

  <main class="container dash-page">
    <div class="kpis" id="dashKpis"></div>
    <div id="dashBody"></div>
    <div id="dashCalc" class="hidden"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/invest.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
